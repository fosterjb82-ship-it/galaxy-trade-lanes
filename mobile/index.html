<title>Galaxy Trade Lanes Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#070b14">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: desktop command deck. Left rail holds captain, resources and standings; centre holds the contract board and market; the hand dock runs along the bottom of the centre. Single dark look by choice. */
:root{
 --bg:#070b14;--panel:#0d1424;--panel2:#141e38;--line:#2a3b68;--line2:#3b5290;--ink:#e9eff9;--mute:#8a9bc0;
 --amber:#f5b93c;--amber2:#d2701a;--teal:#4cd6ae;--coral:#ff7a63;--violet:#a384f0;
 --c-fuel:#f5a52d;--c-ore:#e68a52;--c-tech:#5aa6f0;--c-cr:#ffd05a;--c-combat:#ff6f5c;--c-cargo:#76cc5c;
 --disp:'Rajdhani','Arial Narrow',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden;
 padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0;max-width:1760px;margin:0 auto}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;display:block}
button,select,input{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:0;min-height:38px;padding:5px 12px}
button{cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-weight:600;box-shadow:inset 0 -3px 0 #0007,inset 0 2px 0 #ffffff12;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.38;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.primary{background:var(--amber);color:#2a1604;border-color:#7a4a08}
.primary:hover:not(:disabled){background:#ffcb55;color:#2a1604;border-color:#fff1a8}
.sm{min-height:30px;font-size:12px;padding:3px 10px}
.mute{color:var(--mute)}.acc{color:var(--amber)}
.eyebrow{font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.notch{clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.panel{background:var(--panel);border:2px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto;min-height:44px}
.brand{font:700 26px/1 var(--disp);letter-spacing:.1em;color:var(--amber)}
.brand small{display:block;font:500 9px/1.3 var(--mono);letter-spacing:.2em;color:var(--mute);text-shadow:none;margin-top:3px}
.status{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center}
.status b{color:var(--ink);font-weight:600}
.top nav{display:flex;gap:8px;align-items:center}
.sound{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel);padding:2px 8px 2px 2px}
.sound button{min-height:30px;font-size:12px;padding:2px 10px;border:0;box-shadow:none;background:transparent}
.sound button.lit{color:var(--teal)}
.sound input[type=range]{width:84px;min-height:0;padding:0;border:0;background:transparent;accent-color:var(--amber)}
.played{flex:0 0 232px;min-width:0;border-left:2px solid var(--line);display:flex;flex-direction:column;background:#0a1020}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 10px 6px}
.phead h2{font-size:15px;letter-spacing:.14em}
.played p{margin:0;padding:0 10px;font-size:12px}
.played ol{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:4px;overflow:auto;scrollbar-width:thin;flex:1;min-height:0}
.played li{display:flex;align-items:center;gap:8px;padding:3px;border:1px solid var(--line);background:var(--panel2)}
.played li.act{border-color:#5a4a22}.played li.res{border-color:#1f5a55}
.played li img{flex:none;border:1px solid #000}
.played li div{min-width:0;line-height:1.2}.played li b{font:600 13px var(--disp);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs{display:flex;flex-wrap:wrap;gap:6px;margin-top:1px}
.g{display:inline-flex;align-items:center;gap:2px;font:600 11.5px var(--mono);color:var(--rc,var(--mute))}
#stage{flex:1;min-height:0;display:flex;flex-direction:column}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px}
.rail{grid-row:1/3;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding-right:2px;scrollbar-width:thin}
.rail .panel{padding:10px;display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.plate{background:linear-gradient(180deg,#1a2848,var(--panel))}
.plate h2{font-size:21px;line-height:1.05;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profit{display:flex;align-items:center;gap:10px}
.profit b{font:700 40px/1 var(--disp);color:var(--amber);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px}
.chip{flex:1;border:2px solid var(--line);background:var(--panel2);padding:4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.chip b{font:600 16px var(--disp);color:var(--ink)}
.pr{display:flex;align-items:center;gap:8px;padding:2px 8px;border:2px solid var(--line);background:var(--panel2);color:var(--rc)}
.pr span{flex:1;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pr b{font:700 22px/1.2 var(--disp);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.pr.zero b{opacity:.35}
.stand{display:flex;align-items:center;gap:8px;padding:3px 8px;border:2px solid var(--line);background:var(--panel2)}
.stand.cur{border-color:var(--teal)}
.stand i{font:600 11px var(--mono);color:var(--mute);font-style:normal;width:1.4em}
.stand div{flex:1;min-width:0;line-height:1.15}.stand div span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand small{font:500 10px var(--mono);color:var(--mute)}
.stand strong{font:700 20px/1 var(--disp);color:var(--amber)}
.piles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.piles b{display:block;font:700 18px/1.1 var(--disp)}
.links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.links button{padding:3px 4px;font-size:11px;min-height:30px}
.center{min-height:0;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;padding-right:4px;scrollbar-width:thin}
.sec{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;align-items:baseline;gap:12px}
.sechead h2{font-size:17px;letter-spacing:.12em;color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,140px);gap:10px;justify-content:start}
.pc{width:140px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;position:relative}
.pc .art{position:relative;height:78px;background:#000;overflow:hidden}
.pc .pb{padding:6px 6px 7px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.pc h3{font-size:15px;line-height:1.05}
.pc p{margin:0;font-size:11.5px;line-height:1.28;color:var(--mute);flex:1}
.kind{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.act .kind{color:var(--amber)}
.pc.act{border-color:#5a4a22}.pc.res{border-color:#1f5a55}
.badge{position:absolute;display:flex;align-items:center;gap:3px;padding:0 5px 0 3px;background:#05080fe6;border:1px solid var(--line2);font:700 14px/1.3 var(--disp)}
.badge.tl{top:3px;left:3px;color:var(--c-cr)}.badge.tr{top:3px;right:3px;color:var(--ink);font-size:12px}
.badge.profit{top:3px;right:3px;border-color:#7a4a08;color:var(--amber);font-size:16px}
.ctr.ready{border-color:var(--teal);box-shadow:0 0 0 2px #4cd6ae33}
.ctr .go{position:absolute;left:0;right:0;bottom:0;background:#0f6a5ccc;color:#dcfff0;font:600 10px var(--mono);letter-spacing:.16em;text-align:center;padding:2px 0}
.dest{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.reqs{display:flex;flex-wrap:wrap;gap:4px}
.tok{display:inline-flex;align-items:center;gap:2px;padding:0 4px 0 2px;border:1px solid var(--line);background:var(--panel2);font:600 12.5px/1.5 var(--disp);color:var(--rc)}
.tok.miss{opacity:.55}.tok.met{border-color:#2a7a62}
.pc button{width:100%;min-height:27px;font-size:11.5px;padding:2px 4px}
.pc select{width:100%;min-height:30px;font-size:12px;padding:2px 6px}
.hand{grid-column:2;display:flex;align-items:stretch;gap:0;height:250px;min-height:0;overflow:hidden}
.hside{flex:0 0 132px;padding:10px;display:flex;flex-direction:column;gap:8px;border-right:2px solid var(--line);background:linear-gradient(180deg,#1a2848,var(--panel))}
.hside h2{font-size:18px;letter-spacing:.14em}
.hside button{width:100%}
.hside .endb{margin-top:auto}
.hcards{flex:1;min-width:0;display:flex;gap:8px;padding:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;scrollbar-width:thin;align-items:flex-start}
.hcards .pc{flex:0 0 140px;height:100%;overflow:hidden}
.hcards .pc .pb{overflow:auto;scrollbar-width:none}
.hcards .pc.bo{flex-basis:158px;width:158px}
.hcards .pc .scr{min-height:22px;font-size:10px;opacity:.85}
.empty{padding:20px;color:var(--mute);font-size:14px;align-self:center}
.setup{flex:1;min-height:0;overflow:auto;padding:24px;display:grid;grid-template-columns:minmax(300px,1fr) minmax(360px,600px);gap:28px;align-content:start}
.setup h1{font-size:clamp(44px,5.4vw,84px);line-height:.92;letter-spacing:.01em;margin:8px 0 12px;color:var(--amber)}
.setup h1 span{color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
.fields label{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.fields select,.fields input{width:100%}
.heroart{display:flex;flex-direction:column;gap:12px;min-width:0}
.heroart img{width:100%;height:auto;max-width:576px;border:2px solid var(--line)}
.feat{display:grid;grid-template-columns:1fr;gap:8px}
.feat div{border:2px solid var(--line);background:var(--panel);padding:8px 10px;font-size:14px;color:var(--mute)}
.feat b{color:var(--amber);letter-spacing:.1em}
.overlay{position:fixed;inset:0;z-index:20;background:#03060ce8;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px}
.overlay[hidden]{display:none!important}
.dialog{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--panel);border:2px solid var(--amber);padding:24px;outline:none;box-shadow:6px 6px 0 #000a}
.dialog.wide{max-width:860px}
.dialog h2{font-size:34px;margin:6px 0 12px;line-height:1;color:var(--amber)}
.dialog p{font-size:15px;margin:0 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
table.t{width:100%;border-collapse:collapse;font-size:15px}.t th,.t td{padding:7px 6px;border-bottom:2px solid var(--line);text-align:left}.t th{font:500 10px var(--mono);letter-spacing:.12em;color:var(--mute)}
.cols2{columns:2;column-gap:28px}.cols2 p{break-inside:avoid}
.log{font:12px/1.7 var(--mono);color:var(--mute);max-height:60vh;overflow:auto}.log div{padding:3px 0;border-bottom:1px solid var(--line)}
.done{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);background:var(--panel2);margin-bottom:6px}
.done strong{font:700 26px var(--disp);color:var(--amber)}
.toast{position:fixed;left:50%;bottom:280px;transform:translateX(-50%);background:var(--panel2);border:2px solid var(--amber);padding:10px 16px;z-index:30;max-width:90vw;font-size:15px;box-shadow:4px 4px 0 #000a}
@media (max-width:1050px){
 body{overflow:auto}
 #app{height:auto;min-height:100%}
 .shell{display:flex;flex-direction:column}.rail{overflow:visible}.center{overflow:visible}
 .hand{position:sticky;bottom:0;z-index:5;height:300px}
 .setup{grid-template-columns:1fr}
 .top .status{display:none}
}
@media (max-height:780px) and (min-width:1051px){.hand{height:222px}.hcards .pc p{display:none}}

/* Smooth, high-resolution type; only the art stays pixelated. */
h1,h2,h3{font-family:var(--disp)}
button{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:.05em}
.sm{font-size:13px}
.pc p{font-family:var(--body);font-size:13px;line-height:1.35}
.pc h3{font-size:20px;line-height:1.05;letter-spacing:.01em}
.tok{font-size:16px;font-weight:700}
.badge{font-size:19px}.badge.tr{font-size:15px}.badge.profit{font-size:23px}
.pr b{font-size:34px}.profit b{font-size:56px}.chip b{font-size:22px}.piles b{font-size:26px}.stand strong{font-size:30px}.stand div span{font-size:16px;font-weight:600}
.plate h2{font-size:28px}.sechead h2{font-size:23px}.hside h2{font-size:26px}.dialog h2{font-size:38px}.done strong{font-size:30px}
.pc button{font-size:15px}.pc select{font-size:13px}
.setup h1{font-weight:700}
.dialog p,.setup p,.feat div,table.t,.empty,.toast{font-family:var(--body)}
.t td b,.done b{font-family:var(--disp);font-size:18px}
@media (max-height:800px) and (min-width:1051px){.pc p{font-size:12px}}
.pc .art{display:flex;justify-content:center}
@media (max-width:1050px){.played{flex-basis:180px}}

.pool{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.pool .pr{padding:3px 5px;gap:4px}
.pool .pr{min-width:0}.pool .pr span{font-size:9.5px;letter-spacing:.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pool .pr b{min-width:0}
.reqs{gap:3px}
.tok{font-size:14px;padding:0 5px 0 3px;gap:3px}
.stand small{white-space:nowrap}
/* Phone build. Loaded after style.css and overrides it.
   Layout: compact header, a fixed strip with this turn's pool, one scrolling tab body,
   and a tab bar in thumb reach at the bottom. Single dark look by choice. */
html,body{height:100%}
body{overflow:hidden;padding-block:6px 0;-webkit-tap-highlight-color:transparent}
#app{height:100%;gap:6px;max-width:720px;min-height:0}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;min-height:0}
.brand{font-size:19px;letter-spacing:.08em;line-height:1;min-width:0}
.brand small{font-size:8.5px;letter-spacing:.18em;margin-top:3px}
.top .status{display:block;grid-column:1/-1;text-align:left;font-size:11px;letter-spacing:.08em;line-height:1.3}
.top .status:empty{display:none}
.top nav{gap:6px}
.top nav button{min-height:38px;padding:4px 10px;font-size:13px}
#mus.lit{color:var(--teal);border-color:#2a7a62}
button:hover:not(:disabled){border-color:var(--line);color:inherit}
.primary:hover:not(:disabled){background:var(--amber);color:#2a1604;border-color:#7a4a08}

/* setup */
.setup{display:flex;flex-direction:column;gap:14px;padding:4px 0 24px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.setup>div:first-child{order:2}
.heroart{order:1}
.heroart img{max-width:100%}
.feat{display:none}
.setup h1{font-size:clamp(34px,10.5vw,52px);margin:6px 0 10px}
.fields{grid-template-columns:1fr;gap:10px;margin:12px 0}
.fields select,.fields input{min-height:46px;font-size:16px}
.setup .btns button{flex:1 1 140px;min-height:50px}

/* game shell */
.mgame{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.msum{flex:none;background:linear-gradient(180deg,#1a2848,var(--panel));border:2px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:6px}
.mprof{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.mprof b{font:700 32px/1 var(--disp);color:var(--amber);font-variant-numeric:tabular-nums}
.mchip{display:flex;align-items:baseline;gap:6px;border:2px solid var(--line);background:var(--panel2);padding:2px 8px}
.mchip b{font:700 21px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.mpool{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.mp{display:flex;flex-direction:column;align-items:center;border:2px solid var(--line);background:var(--panel2);padding:4px 0 2px;color:var(--rc);min-width:0}
.mp b{font:700 20px/1 var(--disp);font-variant-numeric:tabular-nums;margin-top:2px}
.mp i{font:500 8.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-style:normal}
.mp.zero b{opacity:.35}
.mbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.mtabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-bottom:6px}
.mtabs button{min-height:52px;padding:4px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;letter-spacing:.04em}
.mtabs button.on{border-color:var(--amber);color:var(--amber);background:#1d2a4c}
.mtabs em{font:600 11px/1.3 var(--mono);font-style:normal;color:var(--mute);min-height:1.3em}
.mtabs em.hot{color:#06231c;background:var(--teal);padding:0 6px}
.sechead{flex-wrap:wrap;gap:2px 10px}
.sechead h2{font-size:19px}

/* cards: two columns that fill the width */
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pc{width:auto;min-width:0}
.pc .art{height:auto}
.pc .art img.px{width:100%;height:auto}
.pc h3{font-size:19px}
.pc p{font-size:13px}
.pc button{min-height:42px;font-size:13px}
.pc .scr{min-height:34px;font-size:11px;opacity:.85}
.pc select{min-height:42px;font-size:16px}
.tok{font-size:15px}

/* hand tab */
.mact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mact button{min-height:50px}
.mpatrol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 6px;font-size:14px}
.mpatrol small{font:500 9.5px/1.2 var(--body);letter-spacing:.02em;text-transform:none;opacity:.8}
.mend{margin-left:auto;min-height:44px;padding:4px 14px;font-size:15px;white-space:nowrap}
.mrow .mprof{flex:0 0 auto}
.played{flex:none;border:2px solid var(--line);background:#0a1020}
.played ol{overflow:visible}
.played p{padding-bottom:10px}
.empty{align-self:stretch;text-align:center;border:2px dashed var(--line)}
.mnote{margin:0;text-align:center}

/* captains tab */
.mpanel{padding:10px;display:flex;flex-direction:column;gap:6px}
.stand{padding:6px 8px}
.links button{min-height:44px;font-size:12px}

/* dialogs */
.overlay{padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.dialog{padding:18px;max-height:90%}
.dialog h2,.dialog.wide h2{font-size:28px}
.cols2{columns:1}
.dialog .btns button{flex:1 1 120px;min-height:48px}
table.t{font-size:13px}.t th,.t td{padding:6px 4px}
.mmenu{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.mmenu button{min-height:50px}
.mvol{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--panel2);padding:8px 12px}
.mvol label{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mvol input{flex:1;min-height:32px;padding:0;border:0;background:transparent;accent-color:var(--amber)}
.toast{bottom:84px;max-width:calc(100vw - 32px)}

const W={deal:7,house:8,quarter:6,pack:5,borer:4,barge:3.5,vault:4,gunship:3.5,probe:4,deck:4.5,broker:2,wing:4,buyout:2.5};

   const pool={...p.pool};Object.entries(c.g).forEach(([r,n])=>pool[r]+=n);
   const opens=s.board.some(b=>Object.entries(b.req).every(([r,n])=>pool[r]>=n)&&pool.cargo>=need(b));
   return opens?9:x.k==='deck'?7:x.k==='broker'?6:x.k==='gunship'?5:3};
  cand.sort((a,b)=>val(b)-val(a));
  const foe=s.players.map((t,i)=>({i,pr:t.profit})).filter(t=>t.i!==s.current).sort((a,b)=>b.pr-a.pr)[0];
  play(s,cand[0].i,foe&&foe.i);playResources(s);

}
function botTurn(s){

}

function gains(k){const c=E.CARDS[k],out=Object.entries(c.g).map(([r,n])=>'<span class="g" style="--rc:var(--c-'+r+')">'+icon(r,1.4)+'+'+n+'</span>');
 if(c.draw)out.push('<span class="g">+'+c.draw+' draw</span>');if(c.buys)out.push('<span class="g">+'+c.buys+' buy</span>');if(k==='buyout')out.push('<span class="g" style="--rc:var(--c-combat)">took profit</span>');return out.join('')}
function played(p,hidden){const list=hidden?[]:(p.turnPlayed||[]);
 return '<aside class="played"><div class="phead"><h2>PLAYED</h2><span class="eyebrow">'+list.length+' this turn</span></div>'
 +(list.length?'<ol>'+list.map(k=>'<li class="'+E.CARDS[k].cat+'"><img class="px" src="'+SP.cardURL(k)+'" width="44" height="26" alt=""><div><b>'+E.CARDS[k].n+'</b><div class="gs">'+gains(k)+'</div></div></li>').join('')+'</ol>'
 :'<p class="mute">'+(hidden?'Hidden until the captain begins.':'Cards you play this turn appear here. They go to your discard pile when the turn ends.')+'</p>')+'</aside>'}
function render(){
 if(screen!=='game'){renderSetup();return}
 const old=$('center');if(old)scrollPos=old.scrollTop;
 const oh=document.querySelector('.hcards');if(oh)handX=oh.scrollLeft;
 const p=E.me(s),on=s.phase==='action'&&!s.over,hidden=!on;
 $('status').innerHTML=(s.over?'Run complete':'Round <b>'+s.round+(s.winMode==='rounds'?' / '+s.maxRounds:'')+'</b> · <b>'+esc(p.name)+'</b>')+(s.finalRound&&!s.over?' · <b class="acc">final round</b>':'')+(s.winMode==='profit'?' · first to '+s.target:'');
 const rail='<aside class="rail"><section class="panel plate notch"><div class="eyebrow">'+(p.bot?'Computer captain':'Active captain')+'</div><h2>'+esc(p.name)+'</h2><div class="profit">'+icon('star',2.4)+'<b>'+p.profit+'</b><span class="eyebrow">Profit</span></div>'
  +'<div class="chips"><div class="chip"><span class="eyebrow">Buys</span><b>'+p.buys+'</b></div><div class="chip"><span class="eyebrow">Actions</span><b>'+(s.actionLimit?p.actions:'∞')+'</b></div></div></section>'
  +'<section class="panel notch"><div class="eyebrow">This turn\'s pool</div><div class="pool">'+E.RES.map(r=>'<div class="pr'+(p.pool[r]?'':' zero')+'" style="--rc:var(--c-'+r+')">'+icon(r,2)+'<span>'+E.RLABEL[r]+'</span><b>'+p.pool[r]+'</b></div>').join('')+'</div>'
  +'<button data-a="patrol"'+(!on||p.patrolled||p.pool.combat<3||p.pool.fuel<1?' disabled':'')+'>'+(p.patrolled?'Patrol cleared':'Pirate patrol · 3 cbt + 1 fuel → +5')+'</button></section>'
  +'<section class="panel notch"><div class="eyebrow">Standings</div>'+standings()+'</section>'
  +'<section class="panel notch"><div class="eyebrow">Your deck</div><div class="piles"><div><b>'+p.deck.length+'</b><span class="eyebrow">Draw</span></div><div><b>'+p.discard.length+'</b><span class="eyebrow">Discard</span></div><div><b>'+E.deckSize(p)+'</b><span class="eyebrow">Total</span></div></div><div class="links"><button data-a="deck">Deck</button><button data-a="done">Deliveries</button><button data-a="log">Log</button></div></section></aside>';
 const center='<section class="center" id="center"><div class="sec"><div class="sechead"><h2>CONTRACT BOARD</h2><span class="eyebrow">First to pay claims it · refills at once · '+s.done.length+' delivered</span></div><div class="grid">'+s.board.map(ctrCard).join('')+'</div></div>'
  +'<div class="sec"><div class="sechead"><h2>CARD MARKET</h2><span class="eyebrow">Bought cards go to discard · no immediate effect</span></div><div class="grid">'+E.MARKET.map(k=>cardEl(k,0,true)).join('')+'</div></div></section>';
 const hasRes=p.hand.some(k=>E.CARDS[k].cat==='res');
 const hand='<section class="panel hand notch"><div class="hside"><div><h2>HAND</h2><span class="eyebrow">'+(hidden?'hidden':p.hand.length+' cards')+'</span></div><button data-a="res"'+(on&&hasRes?'':' disabled')+'>Play resources</button><button class="primary endb" data-a="'+(s.over?'new':'endAsk')+'"'+(!s.over&&!on?' disabled':'')+'>'+(s.over?'New run':'End turn')+'</button></div>'
  +(hidden?'<div class="empty">Hand hidden until the captain begins.</div>':p.hand.length?'<div class="hcards">'+p.hand.map((k,i)=>cardEl(k,i,false)).join('')+'</div>':'<div class="empty">Hand played out. Deliver, buy, or end your turn.</div>')+played(p,hidden)+'</section>';
 $('stage').innerHTML='<div class="shell">'+rail+center+hand+'</div>';
 $('center').scrollTop=scrollPos;const h=document.querySelector('.hcards');if(h)h.scrollLeft=handX;
}
function table(){return '<table class="t"><thead><tr><th>CAPTAIN</th><th>PROFIT</th><th>DELIVERIES</th></tr></thead><tbody>'+[...s.players].sort((a,b)=>b.profit-a.profit).map(p=>'<tr><td>'+esc(p.name)+'</td><td class="acc">'+p.profit+'</td><td>'+p.completed+'</td></tr>').join('')+'</tbody></table>'}
function phase(){
 if(screen!=='game')return;const p=E.me(s);
 if(s.over){const hi=Math.max(...s.players.map(x=>x.profit)),w=s.players.filter(x=>x.profit===hi);
  modal('<div class="eyebrow">Run complete · Round '+s.round+'</div><h2>'+w.map(x=>esc(x.name)).join(' & ')+(w.length>1?' share the win.':' wins.')+'</h2>'+table()+'<p class="mute" style="margin-top:10px">Only profit counts. Unspent credits and deck size do not.</p><div class="btns"><button class="primary" data-a="setup">New run</button><button data-a="review">Review board</button></div>');return}
 if(s.phase==='handoff'){modal('<div class="eyebrow">Round '+s.round+' · '+(s.finalRound?'Final round':'Next captain')+'</div><h2>'+esc(p.name)+', you are up.</h2><p class="mute">'+(s.mode==='local'?'Pass the device to this captain. Their hand stays hidden until they begin.':'The board is shared. Build a hand that claims it first.')+'</p><p>5-card hand · '+E.deckSize(p)+' cards in deck · '+p.profit+' profit</p><div class="btns"><button class="primary" data-a="begin">Begin turn</button></div>');return}
 hide();
}
function rules(){modal('<div class="eyebrow">How Galaxy Trade Lanes works</div><h2>Every purchase changes your next hand.</h2><div class="cols2">'
 +'<p><b class="acc">Deck.</b> Each captain starts with 4 Scrip, 3 Fuel Drums, 2 Ore Samples and 1 Hold Rig, and draws 5 cards per turn. Credits only come from played cards.</p>'
 +'<p><b class="acc">Playing cards.</b> Resource cards are unlimited. Action cards (anything that draws, adds cargo, combat or purchases) use one action; the default is two per turn. Draw effects resolve at once.</p>'
 +'<p><b class="acc">Contracts.</b> The shared board holds 3 to 5 jobs. Pay the listed fuel, ore, tech, credits and combat, plus cargo space equal to ore + tech. Your base space is 1, so play Hold Rigs and Barges to carry more. Each delivery uses its space for the rest of the turn. A replacement appears immediately.</p>'
 +'<p><b class="acc">Buying.</b> One purchase per turn (Brokerage adds one). Bought cards go to your discard pile and have no immediate effect.</p>'
 +'<p><b class="acc">Combat.</b> Combat covers escort requirements. Or spend 3 combat and 1 fuel for a pirate patrol worth +5 profit, once per turn. There are no dice.</p>'
 +'<p><b class="acc">Buyout.</b> Costs 6. Take up to 2 profit from a rival, draw a card, and scrap the card.</p>'
 +'<p><b class="acc">Thinning.</b> Once per turn, pay 1 credit to scrap one unplayed card from your hand.</p>'
 +'<p><b class="acc">Ending.</b> Unused resources vanish, hand and played cards go to discard, you draw 5. Discard reshuffles only when the draw pile runs out.</p>'
 +'<p><b class="acc">Winning.</b> Highest profit after the set rounds, or the round in which someone reaches the target. Everyone gets equal turns and ties share the win.</p></div><div class="btns"><button class="primary" data-a="close">Back</button></div>',true)}
function showRecords(){const a=records();modal('<div class="eyebrow">This browser · best 30</div><h2>Captain records.</h2>'+(a.length?'<table class="t"><thead><tr><th>CAPTAIN</th><th>PROFIT</th><th>RANK</th><th>ROUND</th><th>MODE</th></tr></thead><tbody>'+a.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+r.profit+'</td><td>#'+r.rank+'</td><td>'+r.round+'</td><td>'+(r.mode==='profit'?'target':'rounds')+' / '+(r.limit===0?'unlimited':'2 act')+'</td></tr>').join('')+'</tbody></table>':'<p class="mute">Finish a run to record a score.</p>')+'<div class="btns"><button class="primary" data-a="close">Back</button></div>')}
function viewDeck(){const p=E.me(s),c={};[...p.hand,...p.deck,...p.discard,...p.played].forEach(k=>c[k]=(c[k]||0)+1);
 modal('<div class="eyebrow">'+esc(p.name)+' · deck inventory</div><h2>'+E.deckSize(p)+' cards.</h2><table class="t">'+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<tr><td>'+E.CARDS[k].n+'</td><td class="mute">'+E.CARDS[k].t+'</td><td>×'+n+'</td></tr>').join('')+'</table><p class="mute" style="margin-top:10px">All piles combined. Draw order stays hidden.</p><div class="btns"><button class="primary" data-a="close">Back</button></div>')}
function viewDone(){modal('<div class="eyebrow">All captains · this run</div><h2>Deliveries.</h2>'+(s.done.length?[...s.done].reverse().map(c=>'<div class="done"><div><div class="eyebrow">Round '+c.round+' · '+esc(c.captain)+'</div><b>'+esc(c.name)+'</b> <span class="mute">to '+esc(c.dest)+'</span></div><strong>+'+c.profit+'</strong></div>').join(''):'<p class="mute">No deliveries yet.</p>')+'<div class="btns"><button class="primary" data-a="close">Back</button></div>')}
function viewLog(){modal('<div class="eyebrow">Latest 50 events</div><h2>Run log.</h2><div class="log">'+s.log.map(t=>'<div>'+esc(t)+'</div>').join('')+'</div><div class="btns"><button class="primary" data-a="close">Back</button></div>')}
function closeDlg(){if(screen==='game'&&s&&(s.phase==='handoff'||s.over)){phase()}else hide()}

/* ---------- events ---------- */
document.addEventListener('change',e=>{const k=e.target.id;if(k in cfg&&k!=='names'&&screen==='setup'){collect();cfg[k]=k==='winMode'?e.target.value:Number(e.target.value);
 if(k==='humans'){cfg.bots=Math.min(cfg.bots,6-cfg.humans);if(cfg.humans+cfg.bots<2)cfg.bots=1}renderSetup()}});
function musicUI(){const b=$('mus');if(!b)return;b.textContent=Music.on?'Music on':'Music off';b.setAttribute('aria-pressed',String(Music.on));b.classList.toggle('lit',Music.on)}
function musicPref(v){try{localStorage.setItem(MUS,JSON.stringify(v))}catch(e){}}
let musicWanted=true;try{const m=JSON.parse(localStorage.getItem(MUS)||'null');if(m){musicWanted=m.on!==false;if(typeof m.vol==='number'){Music.setVol(m.vol);$('vol').value=m.vol}}}catch(e){}
document.addEventListener('pointerdown',function first(e){document.removeEventListener('pointerdown',first,true);if(e.target.closest&&e.target.closest('#mus,#vol'))return;if(musicWanted&&!Music.on){try{Music.start()}catch(x){}musicUI()}},true);
$('vol').addEventListener('input',e=>{Music.setVol(Number(e.target.value));musicPref({on:Music.on,vol:Music.vol})});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,id=Number(b.dataset.id);
 if(a==='music'){try{if(Music.on){Music.stop();musicWanted=false}else{Music.start();musicWanted=true}}catch(x){notify('This browser blocked audio.')}musicPref({on:musicWanted,vol:Music.vol});musicUI();return}
 else if(a==='start')start();
 else if(a==='begin')act(()=>E.begin(s));
 else if(a==='play')act(()=>E.play(s,id,$('bt'+id)?Number($('bt'+id).value):undefined));
 else if(a==='res')act(()=>E.playResources(s));
 else if(a==='buy')act(()=>E.buy(s,b.dataset.key));
 else if(a==='complete')act(()=>E.complete(s,id));
 else if(a==='patrol')act(()=>E.patrol(s));
 else if(a==='scrap')act(()=>E.scrap(s,id));
 else if(a==='end'){s.warned=s.warned||{};s.warned[s.current]=true;act(()=>E.end(s))}
 else if(a==='endAsk'){s.warned=s.warned||{};if(s.warned[s.current])act(()=>E.end(s));else modal('<h2>End your turn?</h2><p>Unspent resources expire. Your hand and played cards go to discard, then you draw a new hand of 5. This reminder only appears on your first turn.</p><div class="btns"><button class="primary" data-a="end">End turn</button><button data-a="close">Cancel</button></div>')}
 else if(a==='rules')rules();
 else if(a==='records')showRecords();
 else if(a==='deck')viewDeck();
 else if(a==='done')viewDone();
 else if(a==='log')viewLog();
 else if(a==='review')hide();
 else if(a==='close')closeDlg();
 else if(a==='setup'){s=null;try{localStorage.removeItem(SAVE)}catch(x){}renderSetup()}
 else if(a==='new'){if(s&&!s.over&&screen==='game')modal('<h2>Start a new run?</h2><p>The current run will be replaced. Saved records stay.</p><div class="btns"><button class="primary" data-a="setup">New run</button><button data-a="close">Cancel</button></div>');else renderSetup()}
});
document.addEventListener('keydown',e=>{
 if($('overlay').hidden)return;
 if(e.key==='Escape')closeDlg();
 if(e.key==='Tab'){const f=[...$('dialog').querySelectorAll('button:not(:disabled),select,input')];if(!f.length){e.preventDefault();return}
  const first=f[0],last=f[f.length-1],cur=document.activeElement;
  if(e.shiftKey&&(cur===first||cur===$('dialog'))){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&(cur===last||cur===$('dialog'))){e.preventDefault();first.focus()}}
});
(function boot(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE))}catch(e){}
 musicUI();if(saved&&saved.v===1&&saved.players&&saved.board){s=saved;screen='game';settle()}else renderSetup();
})();
/* Phone build: replaces the desktop game screen with a tabbed layout.
   Loaded after ui.js in the same script, so it reuses its helpers and game state. */
let tab='hand',shownTab=null,turnKey=null,tabScroll={};

render=function(){
 if(screen!=='game'){renderSetup();return}
 const body=document.querySelector('.mbody');if(body&&shownTab)tabScroll[shownTab]=body.scrollTop;
 const p=E.me(s),on=s.phase==='action'&&!s.over,hidden=!on;
 const key=s.round+':'+s.current;if(key!==turnKey){turnKey=key;tab='hand';tabScroll={}}
 $('status').innerHTML=(s.over?'Run complete':'Round <b>'+s.round+(s.winMode==='rounds'?' / '+s.maxRounds:'')+'</b> · <b>'+esc(p.name)+'</b>')+(s.finalRound&&!s.over?' · <b class="acc">final round</b>':'')+(s.winMode==='profit'?' · first to '+s.target:'');

 const sum='<div class="msum"><div class="mrow"><div class="mprof">'+icon('star',2.2)+'<b>'+p.profit+'</b></div>'
  +'<div class="mchip"><span class="eyebrow">Buys</span><b>'+p.buys+'</b></div><div class="mchip"><span class="eyebrow">Act</span><b>'+(s.actionLimit?p.actions:'∞')+'</b></div>'
  +'<button class="primary mend" data-a="'+(s.over?'new':'endAsk')+'"'+(!s.over&&!on?' disabled':'')+'>'+(s.over?'New run':'End turn')+'</button></div>'
  +'<div class="mpool">'+E.RES.map(r=>'<span class="mp'+(p.pool[r]?'':' zero')+'" style="--rc:var(--c-'+r+')" title="'+E.RLABEL[r]+'">'+icon(r,1.8)+'<b>'+p.pool[r]+'</b><i>'+SHORT[r]+'</i></span>').join('')+'</div></div>';

 const ready=on?s.board.filter(c=>E.canComplete(s,c)).length:0;
 const afford=on&&p.buys>0?E.MARKET.filter(k=>s.market[k]>0&&p.pool.cr>=E.CARDS[k].cost).length:0;
 let h='';
 if(tab==='hand'){
  const hasRes=p.hand.some(k=>E.CARDS[k].cat==='res');
  const canPatrol=on&&!p.patrolled&&p.pool.combat>=3&&p.pool.fuel>=1;
  h='<div class="mact"><button data-a="res"'+(on&&hasRes?'':' disabled')+'>Play all resources</button><button class="mpatrol'+(canPatrol?' primary':'')+'" data-a="patrol"'+(canPatrol?'':' disabled')+'>'+(p.patrolled?'Patrol cleared':'Pirate patrol +5')+'<small>3 combat + 1 fuel · once per turn</small></button></div>'
   +(hidden?'<div class="empty">Hand hidden until the captain begins.</div>':p.hand.length?'<div class="grid">'+p.hand.map((k,i)=>cardEl(k,i,false)).join('')+'</div>':'<div class="empty">Hand played out. Deliver, buy, or end your turn.</div>')
   +played(p,hidden)
   +'<p class="eyebrow mnote">Draw pile '+p.deck.length+' · Discard '+p.discard.length+' · '+E.deckSize(p)+' cards total</p>';
 }else if(tab==='board'){
  h='<div class="sechead"><h2>CONTRACT BOARD</h2><span class="eyebrow">First to pay claims it · '+s.done.length+' delivered</span></div><div class="grid">'+s.board.map(ctrCard).join('')+'</div>';
 }else if(tab==='market'){
  h='<div class="sechead"><h2>CARD MARKET</h2><span class="eyebrow">Bought cards go to your discard pile</span></div><div class="grid">'+E.MARKET.map(k=>cardEl(k,0,true)).join('')+'</div>';
 }else{
  h='<section class="panel mpanel notch"><div class="eyebrow">Standings</div>'+standings()+'</section>'
   +'<section class="panel mpanel notch"><div class="eyebrow">Your deck</div><div class="piles"><div><b>'+p.deck.length+'</b><span class="eyebrow">Draw</span></div><div><b>'+p.discard.length+'</b><span class="eyebrow">Discard</span></div><div><b>'+E.deckSize(p)+'</b><span class="eyebrow">Total</span></div></div><div class="links"><button data-a="deck">Deck</button><button data-a="done">Deliveries</button><button data-a="log">Log</button></div></section>';
 }
 const T=[['hand','Hand',hidden?'':p.hand.length+(p.hand.length===1?' card':' cards')],['board','Contracts',ready?ready+' ready':''],['market','Market',afford?afford+' buyable':''],['crew','Captains','']];
 const tabs='<nav class="mtabs" role="tablist" aria-label="Game sections">'+T.map(([k,l,n])=>'<button role="tab" data-a="tab" data-t="'+k+'" aria-selected="'+(tab===k)+'"'+(tab===k?' class="on"':'')+'>'+l+'<em'+(k==='board'&&ready?' class="hot"':'')+'>'+n+'</em></button>').join('')+'</nav>';
 $('stage').innerHTML='<div class="mgame">'+sum+'<div class="mbody" role="tabpanel">'+h+'</div>'+tabs+'</div>';
 shownTab=tab;document.querySelector('.mbody').scrollTop=tabScroll[tab]||0;
};

function menu(){
 modal('<div class="eyebrow">Galaxy Trade Lanes · phone build</div><h2>Menu</h2><div class="mmenu">'
  +'<div class="mvol"><label for="vol2">Music volume</label><input id="vol2" type="range" min="0" max="1" step="0.05" value="'+Music.vol+'"></div>'
  +'<button data-a="rules">Rules</button><button data-a="records">Records</button>'
  +(screen==='game'?'<button data-a="new">New run</button>':'')
  +'<button class="primary" data-a="close">Back</button></div>');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 if(b.dataset.a==='tab'){tab=b.dataset.t;render()}else if(b.dataset.a==='menu')menu()});
document.addEventListener('input',e=>{if(e.target.id==='vol2'){Music.setVol(Number(e.target.value));$('vol').value=e.target.value;musicPref({on:Music.on,vol:Music.vol})}});
if(screen==='game')render();
</script>
