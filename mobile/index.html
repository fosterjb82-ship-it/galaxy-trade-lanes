<title>Galaxy Trade Lanes Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#070b14">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: desktop command deck. Left rail holds captain, resources and standings; centre holds the contract board and market; the hand dock runs along the bottom of the centre. Single dark look by choice. */
:root{
 --bg:#070b14;--panel:#0d1424;--panel2:#141e38;--line:#2a3b68;--line2:#3b5290;--ink:#e9eff9;--mute:#8a9bc0;
 --amber:#f5b93c;--amber2:#d2701a;--teal:#4cd6ae;--coral:#ff7a63;--violet:#a384f0;
 --c-fuel:#f5a52d;--c-ore:#e68a52;--c-tech:#5aa6f0;--c-cr:#ffd05a;--c-combat:#ff6f5c;--c-cargo:#76cc5c;
 --disp:'Rajdhani','Arial Narrow',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden;
 padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0;max-width:1760px;margin:0 auto}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;display:block}
button,select,input{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:0;min-height:38px;padding:5px 12px}
button{cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-weight:600;box-shadow:inset 0 -3px 0 #0007,inset 0 2px 0 #ffffff12;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.38;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.primary{background:var(--amber);color:#2a1604;border-color:#7a4a08}
.primary:hover:not(:disabled){background:#ffcb55;color:#2a1604;border-color:#fff1a8}
.sm{min-height:30px;font-size:12px;padding:3px 10px}
.mute{color:var(--mute)}.acc{color:var(--amber)}
.eyebrow{font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.notch{clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.panel{background:var(--panel);border:2px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto;min-height:44px}
.brand{font:700 26px/1 var(--disp);letter-spacing:.1em;color:var(--amber)}
.brand small{display:block;font:500 9px/1.3 var(--mono);letter-spacing:.2em;color:var(--mute);text-shadow:none;margin-top:3px}
.status{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center}
.status b{color:var(--ink);font-weight:600}
.top nav{display:flex;gap:8px;align-items:center}
.sound{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel);padding:2px 8px 2px 2px}
.sound button{min-height:30px;font-size:12px;padding:2px 10px;border:0;box-shadow:none;background:transparent}
.sound button.lit{color:var(--teal)}
.sound input[type=range]{width:84px;min-height:0;padding:0;border:0;background:transparent;accent-color:var(--amber)}
.played{flex:0 0 232px;min-width:0;border-left:2px solid var(--line);display:flex;flex-direction:column;background:#0a1020}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 10px 6px}
.phead h2{font-size:15px;letter-spacing:.14em}
.played p{margin:0;padding:0 10px;font-size:12px}
.played ol{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:4px;overflow:auto;scrollbar-width:thin;flex:1;min-height:0}
.played li{display:flex;align-items:center;gap:8px;padding:3px;border:1px solid var(--line);background:var(--panel2)}
.played li.act{border-color:#5a4a22}.played li.res{border-color:#1f5a55}
.played li img{flex:none;border:1px solid #000}
.played li div{min-width:0;line-height:1.2}.played li b{font:600 13px var(--disp);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs{display:flex;flex-wrap:wrap;gap:6px;margin-top:1px}
.g{display:inline-flex;align-items:center;gap:2px;font:600 11.5px var(--mono);color:var(--rc,var(--mute))}
#stage{flex:1;min-height:0;display:flex;flex-direction:column}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px}
.rail{grid-row:1/3;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding-right:2px;scrollbar-width:thin}
.rail .panel{padding:10px;display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.plate{background:linear-gradient(180deg,#1a2848,var(--panel))}
.plate h2{font-size:21px;line-height:1.05;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profit{display:flex;align-items:center;gap:10px}
.profit b{font:700 40px/1 var(--disp);color:var(--amber);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px}
.chip{flex:1;border:2px solid var(--line);background:var(--panel2);padding:4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.chip b{font:600 16px var(--disp);color:var(--ink)}
.pr{display:flex;align-items:center;gap:8px;padding:2px 8px;border:2px solid var(--line);background:var(--panel2);color:var(--rc)}
.pr span{flex:1;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pr b{font:700 22px/1.2 var(--disp);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.pr.zero b{opacity:.35}
.stand{display:flex;align-items:center;gap:8px;padding:3px 8px;border:2px solid var(--line);background:var(--panel2)}
.stand.cur{border-color:var(--teal)}
.stand i{font:600 11px var(--mono);color:var(--mute);font-style:normal;width:1.4em}
.stand div{flex:1;min-width:0;line-height:1.15}.stand div span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand small{font:500 10px var(--mono);color:var(--mute)}
.stand strong{font:700 20px/1 var(--disp);color:var(--amber)}
.piles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.piles b{display:block;font:700 18px/1.1 var(--disp)}
.links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.links button{padding:3px 4px;font-size:11px;min-height:30px}
.center{min-height:0;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;padding-right:4px;scrollbar-width:thin}
.sec{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;align-items:baseline;gap:12px}
.sechead h2{font-size:17px;letter-spacing:.12em;color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,140px);gap:10px;justify-content:start}
.pc{width:140px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;position:relative}
.pc .art{position:relative;height:78px;background:#000;overflow:hidden}
.pc .pb{padding:6px 6px 7px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.pc h3{font-size:15px;line-height:1.05}
.pc p{margin:0;font-size:11.5px;line-height:1.28;color:var(--mute);flex:1}
.kind{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.act .kind{color:var(--amber)}
.pc.act{border-color:#5a4a22}.pc.res{border-color:#1f5a55}
.badge{position:absolute;display:flex;align-items:center;gap:3px;padding:0 5px 0 3px;background:#05080fe6;border:1px solid var(--line2);font:700 14px/1.3 var(--disp)}
.badge.tl{top:3px;left:3px;color:var(--c-cr)}.badge.tr{top:3px;right:3px;color:var(--ink);font-size:12px}
.badge.profit{top:3px;right:3px;border-color:#7a4a08;color:var(--amber);font-size:16px}
.ctr.ready{border-color:var(--teal);box-shadow:0 0 0 2px #4cd6ae33}
.ctr .go{position:absolute;left:0;right:0;bottom:0;background:#0f6a5ccc;color:#dcfff0;font:600 10px var(--mono);letter-spacing:.16em;text-align:center;padding:2px 0}
.dest{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.reqs{display:flex;flex-wrap:wrap;gap:4px}
.tok{display:inline-flex;align-items:center;gap:2px;padding:0 4px 0 2px;border:1px solid var(--line);background:var(--panel2);font:600 12.5px/1.5 var(--disp);color:var(--rc)}
.tok.miss{opacity:.55}.tok.met{border-color:#2a7a62}
.pc button{width:100%;min-height:27px;font-size:11.5px;padding:2px 4px}
.pc select{width:100%;min-height:30px;font-size:12px;padding:2px 6px}
.hand{grid-column:2;display:flex;align-items:stretch;gap:0;height:250px;min-height:0;overflow:hidden}
.hside{flex:0 0 132px;padding:10px;display:flex;flex-direction:column;gap:8px;border-right:2px solid var(--line);background:linear-gradient(180deg,#1a2848,var(--panel))}
.hside h2{font-size:18px;letter-spacing:.14em}
.hside button{width:100%}
.hside .endb{margin-top:auto}
.hcards{flex:1;min-width:0;display:flex;gap:8px;padding:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;scrollbar-width:thin;align-items:flex-start}
.hcards .pc{flex:0 0 140px;height:100%;overflow:hidden}
.hcards .pc .pb{overflow:auto;scrollbar-width:none}
.hcards .pc.bo{flex-basis:158px;width:158px}
.hcards .pc .scr{min-height:22px;font-size:10px;opacity:.85}
.empty{padding:20px;color:var(--mute);font-size:14px;align-self:center}
.setup{flex:1;min-height:0;overflow:auto;padding:24px;display:grid;grid-template-columns:minmax(300px,1fr) minmax(360px,600px);gap:28px;align-content:start}
.setup h1{font-size:clamp(44px,5.4vw,84px);line-height:.92;letter-spacing:.01em;margin:8px 0 12px;color:var(--amber)}
.setup h1 span{color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
.fields label{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.fields select,.fields input{width:100%}
.heroart{display:flex;flex-direction:column;gap:12px;min-width:0}
.heroart img{width:100%;height:auto;max-width:576px;border:2px solid var(--line)}
.feat{display:grid;grid-template-columns:1fr;gap:8px}
.feat div{border:2px solid var(--line);background:var(--panel);padding:8px 10px;font-size:14px;color:var(--mute)}
.feat b{color:var(--amber);letter-spacing:.1em}
.overlay{position:fixed;inset:0;z-index:20;background:#03060ce8;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px}
.overlay[hidden]{display:none!important}
.dialog{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--panel);border:2px solid var(--amber);padding:24px;outline:none;box-shadow:6px 6px 0 #000a}
.dialog.wide{max-width:860px}
.dialog h2{font-size:34px;margin:6px 0 12px;line-height:1;color:var(--amber)}
.dialog p{font-size:15px;margin:0 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
table.t{width:100%;border-collapse:collapse;font-size:15px}.t th,.t td{padding:7px 6px;border-bottom:2px solid var(--line);text-align:left}.t th{font:500 10px var(--mono);letter-spacing:.12em;color:var(--mute)}
.cols2{columns:2;column-gap:28px}.cols2 p{break-inside:avoid}
.log{font:12px/1.7 var(--mono);color:var(--mute);max-height:60vh;overflow:auto}.log div{padding:3px 0;border-bottom:1px solid var(--line)}
.done{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);background:var(--panel2);margin-bottom:6px}
.done strong{font:700 26px var(--disp);color:var(--amber)}
.toast{position:fixed;left:50%;bottom:280px;transform:translateX(-50%);background:var(--panel2);border:2px solid var(--amber);padding:10px 16px;z-index:30;max-width:90vw;font-size:15px;box-shadow:4px 4px 0 #000a}
@media (max-width:1050px){
 body{overflow:auto}
 #app{height:auto;min-height:100%}
 .shell{display:flex;flex-direction:column}.rail{overflow:visible}.center{overflow:visible}
 .hand{position:sticky;bottom:0;z-index:5;height:300px}
 .setup{grid-template-columns:1fr}
 .top .status{display:none}
}
@media (max-height:780px) and (min-width:1051px){.hand{height:222px}.hcards .pc p{display:none}}

/* Smooth, high-resolution type; only the art stays pixelated. */
h1,h2,h3{font-family:var(--disp)}
button{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:.05em}
.sm{font-size:13px}
.pc p{font-family:var(--body);font-size:13px;line-height:1.35}
.pc h3{font-size:20px;line-height:1.05;letter-spacing:.01em}
.tok{font-size:16px;font-weight:700}
.badge{font-size:19px}.badge.tr{font-size:15px}.badge.profit{font-size:23px}
.pr b{font-size:34px}.profit b{font-size:56px}.chip b{font-size:22px}.piles b{font-size:26px}.stand strong{font-size:30px}.stand div span{font-size:16px;font-weight:600}
.plate h2{font-size:28px}.sechead h2{font-size:23px}.hside h2{font-size:26px}.dialog h2{font-size:38px}.done strong{font-size:30px}
.pc button{font-size:15px}.pc select{font-size:13px}
.setup h1{font-weight:700}
.dialog p,.setup p,.feat div,table.t,.empty,.toast{font-family:var(--body)}
.t td b,.done b{font-family:var(--disp);font-size:18px}
@media (max-height:800px) and (min-width:1051px){.pc p{font-size:12px}}
.pc .art{display:flex;justify-content:center}
@media (max-width:1050px){.played{flex-basis:180px}}

.pool{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.pool .pr{padding:3px 5px;gap:4px}
.pool .pr{min-width:0}.pool .pr span{font-size:9.5px;letter-spacing:.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pool .pr b{min-width:0}
.reqs{gap:3px}
.tok{font-size:14px;padding:0 5px 0 3px;gap:3px}
.stand small{white-space:nowrap}

.left{list-style:none;margin:4px 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.left li{border:2px solid var(--line);background:var(--panel2);padding:8px 10px 8px 30px;position:relative;font-size:15px}
.left li::before{content:'';position:absolute;left:11px;top:50%;width:8px;height:8px;margin-top:-4px;background:var(--amber)}

.dtabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.dtabs button.on{border-color:var(--amber);color:var(--amber);background:#1d2a4c}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.dlist li{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border:2px solid var(--line);background:var(--panel2)}
.dlist li.act{border-color:#5a4a22}.dlist li.res{border-color:#1f5a55}
.dlist li img{flex:none;border:1px solid #000}
.dlist li div{flex:1;min-width:0;line-height:1.25}.dlist li b{display:block;font:600 16px var(--disp)}.dlist li span{font-size:12.5px}
.dlist strong{font:700 22px var(--disp);color:var(--amber);font-variant-numeric:tabular-nums}

.dsub{font-size:20px;letter-spacing:.06em;margin:16px 0 4px;color:var(--amber)}
.dlist li.gone{opacity:.8;border-style:dashed}
.enc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.enc li{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 6px;border:2px solid var(--line);background:var(--panel2)}
.enc li.act{border-color:#5a4a22}.enc li.res{border-color:#1f5a55}
.enc li>img{flex:none;border:1px solid #000}
.enc li>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.3}
.enc li b{font:700 18px var(--disp)}.enc li span{font-size:14px}.enc li small{font-size:12px}
.enc li>strong{display:flex;align-items:center;gap:3px;font:700 20px var(--disp);color:var(--amber);white-space:nowrap}
.enc.moves li>img{width:40px;height:40px;border:0}

.threat{display:flex;align-items:center;gap:8px;padding:6px 10px;border:2px dashed #5a2a2a;background:#1a0d14;color:var(--mute);font-size:13.5px}
.threat.soon{border-style:solid;border-color:var(--coral);color:var(--ink)}.threat b{color:var(--coral)}
.boss{display:flex;gap:12px;padding:10px;border:2px solid var(--coral);background:linear-gradient(180deg,#2a0f18,var(--panel));box-shadow:0 0 0 2px #ff7a6322}
.boss .bart img{width:176px;height:auto;border:2px solid #000}
.boss .bbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.boss h3{font-size:24px;color:var(--coral);letter-spacing:.02em}
.boss p{margin:0;font-size:13.5px}
.hp{position:relative;height:22px;border:2px solid #000;background:#3a1010}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#ff8a6a,#c63a30)}
.hp span{position:relative;display:block;text-align:center;font:700 13px/18px var(--disp);letter-spacing:.06em;color:#fff;text-shadow:1px 1px 0 #000}
.bdmg{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.bdmg b{color:var(--coral);font-size:13px}.bdmg .cur{color:var(--ink)}
.bbtns{display:flex;flex-wrap:wrap;gap:6px}.bbtns button{flex:1 1 180px}
.boss.compact{flex-direction:column;gap:6px}.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.bhead b{font:700 18px var(--disp);color:var(--coral)}
.ctr .go.blk{background:#6a1a1acc;color:#ffd6c4}

.breport{display:flex;gap:14px;align-items:center;margin:6px 0 12px}
.breport img{width:176px;height:auto;border:2px solid #000;flex:none}
.breport.won img{filter:grayscale(.6) brightness(.8)}
.breport h2{margin:0 0 6px}.breport.lost h2{color:var(--coral)}
.breport p{margin:0}
.t tr.me td{background:#1d2a4c}.t td.up{color:var(--teal);font-weight:600}.t td.down{color:var(--coral);font-weight:600}
.tag{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#2a1604;background:var(--amber);padding:1px 5px;margin-left:4px;vertical-align:middle}

.move{display:grid!important;grid-template-columns:88px minmax(0,1fr);gap:6px 8px!important;align-items:center;padding:8px!important;background:var(--panel);border:2px solid var(--line)}
.move>img{border:1px solid #000;width:88px;height:52px}
.move .mv{display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.2}
.move .mv b{font:700 17px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.move .mc{display:flex;align-items:center;gap:3px;font:700 15px var(--disp)}
.move small{font-size:11px;color:var(--mute)}
.move button{grid-column:1/-1;min-height:36px}
.move.patrol .mv b{color:var(--coral)}.move.cash .mv b{color:var(--c-cr)}
.move.patrol.ready{border-color:var(--coral);background:linear-gradient(180deg,#2a0f18,var(--panel));animation:alarm 1.4s ease-in-out infinite}
.move.cash.ready{border-color:var(--c-cr);background:linear-gradient(180deg,#2a2008,var(--panel))}
.move.done{opacity:.6}
.move.patrol.ready button.primary{background:var(--coral);border-color:#7a1a10;color:#2a0606}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 #ff7a6300}50%{box-shadow:0 0 0 3px #ff7a6366}}
@media (prefers-reduced-motion:reduce){.move.patrol.ready{animation:none}}
.rail .move{flex:0 0 auto}
.boss .trait{font:600 13px var(--body);color:var(--amber)}

.bclock{display:flex;align-items:center;gap:8px;font:600 13px var(--body);color:var(--ink)}
.bclock b{font:700 22px/1 var(--disp);color:var(--amber)}
.bclock .pips{display:flex;gap:3px}.bclock .pips i{width:14px;height:14px;border:2px solid #000;background:#3a1010}.bclock .pips i.on{background:var(--amber)}
.bclock.last b,.bclock.last em{color:var(--coral)}.bclock.last .pips i.on{background:var(--coral);animation:alarm 1s ease-in-out infinite}
.bclock em{font-style:normal;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

/* Phone build. Loaded after style.css and overrides it.
   Layout: compact header, a fixed strip with this turn's pool, one scrolling tab body,
   and a tab bar in thumb reach at the bottom. Single dark look by choice. */
html,body{height:100%}
body{overflow:hidden;padding-block:6px 0;-webkit-tap-highlight-color:transparent}
#app{height:100%;gap:6px;max-width:720px;min-height:0}

#mus.lit{color:var(--teal);border-color:#2a7a62}
button:hover:not(:disabled){border-color:var(--line);color:inherit}
.primary:hover:not(:disabled){background:var(--amber);color:#2a1604;border-color:#7a4a08}

/* setup */

function rnd(s){s.seed=(s.seed*16807)%2147483647;return (s.seed-1)/2147483646}

function create(o={}){
 const s={v:1,id:Date.now()+'-'+Math.random().toString(36).slice(2,7),seed:o.seed||(Date.now()%2147483646)+1,

 cfg.forEach(c=>{
  const p={name:String(c.name||'Captain').slice(0,24),bot:!!c.bot,deck:[],hand:[],played:[],discard:[],pool:fresh(),
   buys:1,actions:s.actionLimit,patrolled:false,scrapped:false,profit:0,completed:0,turnPlayed:[],scrappedCards:[]};

 });

 if(!canPlay(s,i))return false;

function buy(s,k){

function patrol(s){const p=me(s);if(!live(s)||p.patrolled||p.pool.combat<3||p.pool.fuel<1)return false;

  +'<button class="primary mend" data-a="'+(s.over?'new':'endAsk')+'"'+(!s.over&&!on?' disabled':'')+'>'+(s.over?'New run':'End turn')+'</button></div>'
  +'<div class="mpool">'+E.RES.map(r=>'<span class="mp'+(p.pool[r]?'':' zero')+'" style="--rc:var(--c-'+r+')" title="'+E.RLABEL[r]+'">'+icon(r,1.8)+'<b>'+p.pool[r]+'</b><i>'+SHORT[r]+'</i></span>').join('')+'</div></div>';

 const ready=on?s.board.filter(c=>E.canComplete(s,c)).length:0;
 const afford=on&&p.buys>0?E.MARKET.filter(k=>s.market[k]>0&&p.pool.cr>=E.CARDS[k].cost).length:0;
 let h='';
 if(tab==='hand'){
  const hasRes=p.hand.some(k=>E.CARDS[k]&&E.CARDS[k].cat==='res');
  const canPatrol=on&&!p.patrolled&&p.pool.combat>=3&&p.pool.fuel>=1;
  h='<div class="mact"><button data-a="res"'+(on&&hasRes?'':' disabled')+'>Play all resources</button><button class="mpatrol'+(canPatrol?' primary':'')+'" data-a="patrol"'+(canPatrol?'':' disabled')+'>'+(p.patrolled?'Patrol cleared':'Pirate patrol +5')+'<small>3 combat + 1 fuel · once per turn'+(E.delayLeft(s)?' · delays boss 1 round':'')+'</small></button></div>'
   +(s.boss?bossPanel(true):'')
   +cashBtn(p,on)
   +(hidden?'<div class="empty">Hand hidden until the captain begins.</div>':p.hand.length?'<div class="grid">'+p.hand.map((k,i)=>cardEl(k,i,false)).join('')+'</div>':'<div class="empty">Hand played out. Deliver, buy, or end your turn.</div>')
   +played(p,hidden)
   +'<p class="eyebrow mnote">Draw pile '+p.deck.length+' · Discard '+p.discard.length+' · '+E.deckSize(p)+' cards total</p>';
 }else if(tab==='board'){
  h='<div class="sechead"><h2>CONTRACT BOARD</h2>'+cdeckPile()+'<span class="eyebrow">First to pay claims it · '+s.done.length+' delivered</span></div>'+bossPanel()+'<div class="grid">'+s.board.map(ctrCard).join('')+'</div>';
 }else if(tab==='market'){
  h='<div class="sechead"><h2>CARD MARKET</h2><span class="eyebrow">Bought cards go to your discard pile</span></div>'+cashBtn(p,on)+'<div class="grid">'+marketList().map(k=>cardEl(k,0,true)).join('')+'</div>';
 }else{
  h='<section class="panel mpanel notch"><div class="eyebrow">Standings</div>'+standings()+'</section>'
   +'<section class="panel mpanel notch"><div class="eyebrow">Your deck</div><div class="piles"><div><b>'+p.deck.length+'</b><span class="eyebrow">Draw</span></div><div><b>'+p.discard.length+'</b><span class="eyebrow">Discard</span></div><div><b>'+E.deckSize(p)+'</b><span class="eyebrow">Total</span></div></div><div class="links"><button data-a="deck">Deck</button><button data-a="done">Deliveries</button><button data-a="log">Log</button></div>'+(s.over?'<button class="primary" data-a="decks">View all captains\' decks</button>':'')+'</section>';
 }
 const T=[['hand','Hand',hidden?'':p.hand.length+(p.hand.length===1?' card':' cards')],['board','Contracts',s.boss?'boss · '+E.bossClock(s).rounds+' rd'+(E.bossClock(s).rounds>1?'s':''):E.nextThreat(s)?'boss in '+(E.nextThreat(s)-s.round):ready?ready+' ready':''],['market','Market',afford?afford+' buyable':''],['crew','Captains','']];
 const tabs='<nav class="mtabs" role="tablist" aria-label="Game sections">'+T.map(([k,l,n])=>'<button role="tab" data-a="tab" data-t="'+k+'" aria-selected="'+(tab===k)+'"'+(tab===k?' class="on"':'')+'>'+l+'<em'+(k==='board'&&s.boss?' class="hot red"':k==='board'&&ready?' class="hot"':'')+'>'+n+'</em></button>').join('')+'</nav>';
 $('stage').innerHTML='<div class="mgame">'+sum+'<div class="mbody" role="tabpanel">'+h+'</div>'+tabs+'</div>';
 shownTab=tab;document.querySelector('.mbody').scrollTop=tabScroll[tab]||0;
 animAfter(snap);
};

function cashBtn(p,on){const n=Math.floor(p.pool.cr/E.CASH),ok=on&&n>0;
 return '<button class="mcash'+(ok?' lit':'')+'" data-a="cash"'+(ok?'':' disabled')+'>Cash in '+E.CASH+' credits → +1 profit<small>'+(ok?'You can do this '+n+(n===1?' time':' times')+' now':'Any time, as often as you can afford')+'</small></button>'}
function menu(){
 modal('<div class="eyebrow">Galaxy Trade Lanes · phone build</div><h2>Menu</h2><div class="mmenu">'
  +'<div class="mvol"><label for="vol2">Music volume</label><input id="vol2" type="range" min="0" max="1" step="0.05" value="'+Music.vol+'"></div>'
  +'<button data-a="rules">Rules</button><button data-a="enc">Encyclopedia</button><button data-a="records">Records</button>'
  +(screen==='game'?'<button data-a="new">New run</button>':'')
  +'<button class="primary" data-a="close">Back</button></div>');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 if(b.dataset.a==='tab'){tab=b.dataset.t;render()}else if(b.dataset.a==='menu')menu()});
document.addEventListener('input',e=>{if(e.target.id==='vol2'){Music.setVol(Number(e.target.value));$('vol').value=e.target.value;musicPref({on:Music.on,vol:Music.vol})}});
if(screen==='game')render();
/* Guided tutorial: a short scripted game against one computer captain.
   Loaded after ui.js (and after mobile/mobile.js in the phone build). A coach box explains each step,
   a spotlight ring shows where to look, and action steps advance when the player has done the thing. */
const Tut=(function(){
let on=false,i=0,busy=false,coach=null,ring=null,seedId=null;
const PHONE=()=>!!document.querySelector('.mtabs');
const me=()=>s&&s.players[0];
const handSel=k=>{const p=me();const idx=p?p.hand.indexOf(k):-1;return idx>=0?'[data-hand="'+idx+'"]':null};
const give=(hand)=>{const p=me();p.hand=hand.slice()};

/* each step: title, text, target (desktop selector), phone {sel, tab}, enter(), done() (action steps) or next:true (info) */
const STEPS=[
 {t:'Welcome aboard, captain',x:'Every captain races to deliver <b>contracts</b> from this shared board. Each one pays <b class="acc">profit</b> (the ★ number). The captain with the most profit at the end of the run wins.',
  sel:'.cband',ph:{sel:'.mbody',tab:'board'},next:true},
 {t:'Your hand',x:'You draw 5 cards each turn. <b class="tg">Resource</b> cards are free to play. <b class="ag">Order</b> cards are stronger, but you can only give 2 orders per turn.',
  sel:'.hgrid',ph:{sel:'.mbody .grid',tab:'hand'},next:true},
 {t:'Play your resources',x:'Click <b>Play resources</b> to play every resource card in your hand at once.',
  sel:'[data-a=res]',ph:{sel:'[data-a=res]',tab:'hand'},done:()=>me().pool.fuel>=1&&me().pool.ore>=1},
 {t:'Your pool',x:'Played cards fill your <b>pool</b> for this turn: fuel, ore, tech, credits, combat and cargo space. Anything you do not spend <b>vanishes</b> when your turn ends.',
  sel:'.pstrip',ph:{sel:'.mpool',tab:'hand'},next:true},
 {t:'Make cargo space',x:'Ore and tech need <b>cargo space</b> to carry, and you start each turn with only 1. Give the <b>Hold Rig</b> order for +2 cargo.',
  sel:()=>handSel('rig'),ph:{sel:()=>handSel('rig'),tab:'hand'},done:()=>me().pool.cargo>=3},
 {t:'Deliver a contract',x:'<b>Seed Stock</b> needs 1 fuel, 1 ore and 1 cargo space, and you have all three, so it is glowing. Click <b>Deliver</b> for +8 profit. A new contract is dealt into its place.',
  sel:()=>'.ctr[data-cid="'+seedId+'"]',ph:{sel:()=>'.ctr[data-cid="'+seedId+'"]',tab:'board'},done:()=>s.done.length>=1},
 {t:'Buy a card',x:'You have 2 credits and 1 <b>deal</b> (purchase) this turn. Buy any card you can afford. It goes to your discard pile and shows up in a later hand, so your deck gets stronger over time.',
  sel:'.mband',ph:{sel:'.mbody .pc.can [data-a=buy]',tab:'market'},done:()=>me().buys===0},
 {t:'End your turn',x:'Nothing left to do. Click <b>End turn</b>. Your rival, Nova Syndicate, takes a turn, then you draw 5 new cards.',
  sel:'[data-a=endAsk]',ph:{sel:'.mend'},done:()=>s.round>=2},
 {t:'Your next turn',x:'Your new hand is ready. Click <b>Begin turn</b>.',
  sel:'#dialog [data-a=begin]',ph:{sel:'#dialog [data-a=begin]'},enter:()=>give(['gunship','drum','scrip','scrip','house']),done:()=>s.round>=2&&s.phase==='action'},
 {t:'Resources again',x:'Play your resources to fill the pool.',
  sel:'[data-a=res]',ph:{sel:'[data-a=res]',tab:'hand'},done:()=>me().pool.cr>=6},
 {t:'Arm up',x:'Give the <b>Gunship</b> order for +3 combat. Combat is used for armed contracts, pirate patrols and boss fights.',
  sel:()=>handSel('gunship'),ph:{sel:()=>handSel('gunship'),tab:'hand'},done:()=>me().pool.combat>=3},
 {t:'Pirate patrol',x:'Spend 3 combat and 1 fuel on a <b>pirate patrol</b> for +5 profit, once per turn. Each patrol can also push the next pirate boss back a round (up to 2 rounds per boss).',
  sel:'.move.patrol',ph:{sel:'.mpatrol',tab:'hand'},done:()=>me().patrolled},
 {t:'Cash in',x:'Leftover credits are wasted at the end of your turn. <b>Cash in</b> 4 credits for +1 profit whenever you have spare.',
  sel:'.move.cash',ph:{sel:'.mcash',tab:'hand'},done:()=>me().pool.cr<6},
 {t:'A pirate boss!',x:'Every few rounds a <b>pirate boss</b> blockades the lanes: nobody can deliver until it is beaten. All captains fight it together. Each one has its own trick, shown in yellow, and a countdown before it raids everyone.',
  sel:'.boss',ph:{sel:'.boss',tab:'board'},next:true,enter:()=>{const B=E.BOSSES.dread;s.threats=true;
   s.boss={key:'dread',name:B.name,trait:B.trait,hp:4,max:4,merc:2,raid:5,bounty:1,regen:0,arrived:s.round,until:s.round+2,dmg:s.players.map(()=>0),no:1};me().hand.push('weapons');Music.sfx('boss')}},
 {t:'Weapons Officer',x:'Give the <b>Weapons Officer</b> order: +2 combat, and every point of combat you spend on a boss this turn deals <b>double damage</b>.',
  sel:()=>handSel('weapons'),ph:{sel:()=>handSel('weapons'),tab:'hand'},done:()=>me().dbl},
 {t:'Attack!',x:'2 combat × 2 = 4 damage, exactly what this boss has left. Click <b>Attack</b>. No combat? You can also hire mercenaries with credits.',
  sel:'.cband [data-a=attack]',ph:{sel:'.boss [data-a=attack]',tab:'board'},done:()=>!s.boss},
 {t:'Victory report',x:'Beating a boss pays every captain +1 profit per damage they dealt, plus +5 for the final blow. Click <b>Confirm</b>.',
  sel:'#dialog [data-a=bossok]',ph:{sel:'#dialog [data-a=bossok]'},done:()=>E.unseen(s,0)<0},
 {t:'You are ready',x:'That is the whole loop: <b>play</b> cards, <b>deliver</b> contracts, <b>buy</b> better cards, fight pirates together, and finish with the most profit. The <b>Rules</b> and <b>Cards</b> buttons explain everything in detail.',
  sel:null,ph:{sel:null},finish:true}
];

function css(){if(document.getElementById('tut-css'))return;const st=document.createElement('style');st.id='tut-css';st.textContent=`
.tut-ring{position:fixed;z-index:65;pointer-events:none;border:3px solid var(--amber);box-shadow:0 0 0 9999px #03060cb0,0 0 22px #f5b93c88;transition:all .25s ease;animation:tutpulse 1.4s ease-in-out infinite}
@keyframes tutpulse{50%{border-color:#fff1a8;box-shadow:0 0 0 9999px #03060cb0,0 0 34px #f5b93ccc}}
@media (prefers-reduced-motion:reduce){.tut-ring{animation:none;transition:none}}
.tut-coach{position:fixed;z-index:70;width:420px;max-width:calc(100vw - 32px);background:var(--panel2);border:3px solid var(--amber);padding:16px 18px;box-shadow:6px 6px 0 #000a;display:flex;flex-direction:column;gap:8px}
.tut-coach .eyebrow{display:flex;justify-content:space-between}
.tut-coach h3{margin:0;font:700 26px var(--disp);color:var(--amber)}
.tut-coach p{margin:0;font-size:16px;line-height:1.45;color:var(--ink)}
.tut-coach .tg{color:var(--teal)}.tut-coach .ag{color:var(--amber)}
.tut-coach .tbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.tut-coach .tbtns button{flex:1 1 auto;min-height:42px}
.tut-coach .hint{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.tut-coach.dock{left:12px!important;right:12px;width:auto;top:auto!important;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.tut-coach.dock.top{bottom:auto;top:calc(8px + env(safe-area-inset-top,0px))!important}
.tut-coach.center{left:50%!important;top:50%!important;transform:translate(-50%,-50%)}`;document.head.append(st)}

function target(){const st=STEPS[i];let sel=PHONE()?st.ph&&st.ph.sel:st.sel;if(typeof sel==='function')sel=sel();if(!sel)return null;
 const el=[...document.querySelectorAll(sel)].find(e=>e.offsetParent!==null||getComputedStyle(e).position==='fixed');return el||null}

function draw(){if(!on)return;css();const st=STEPS[i],z=typeof zoomK==='function'?zoomK():1;
 if(!coach){coach=document.createElement('div');coach.className='tut-coach notch';coach.setAttribute('role','dialog');coach.setAttribute('aria-label','Tutorial');document.body.append(coach)}
 if(!ring){ring=document.createElement('div');ring.className='tut-ring';document.body.append(ring)}
 coach.innerHTML='<div class="eyebrow"><span>Tutorial · step '+(i+1)+' of '+STEPS.length+'</span></div><h3>'+st.t+'</h3><p>'+st.x+'</p>'
  +(st.finish?'<div class="tbtns"><button class="primary" data-tut="keep">Keep playing this run</button><button data-tut="real">Start a real run</button></div>'
   :'<div class="tbtns">'+(st.next?'<button class="primary" data-tut="next">Next</button>':'<span class="hint">Do it to continue</span>')+'<button data-tut="quit">Exit tutorial</button></div>');
 const el=target();
 if(el&&PHONE()){const box=el.closest('.mbody');if(box){const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();if(r.top<b.top||r.bottom>b.bottom)el.scrollIntoView({block:'center'})}}
 if(el){const r=el.getBoundingClientRect(),pad=6;ring.style.display='';
  Object.assign(ring.style,{left:(r.left/z-pad)+'px',top:(r.top/z-pad)+'px',width:(r.width/z+pad*2)+'px',height:(r.height/z+pad*2)+'px'})}
 else{ring.style.display='none'}
 coach.classList.toggle('dock',PHONE()&&!!el);coach.classList.toggle('center',!el);
 if(PHONE()&&el){const r=el.getBoundingClientRect();coach.classList.toggle('top',r.top+r.height/2>innerHeight/2)}
 if(el&&!PHONE()){const r=el.getBoundingClientRect(),W=innerWidth/z,H=innerHeight/z,cw=coach.offsetWidth,ch=coach.offsetHeight,R={l:r.left/z,t:r.top/z,w:r.width/z,h:r.height/z};
  let left,top;
  if(R.t+R.h+ch+24<H){top=R.t+R.h+16}else if(R.t-ch-24>0){top=R.t-ch-16}else{top=Math.max(12,Math.min(H-ch-12,R.t+R.h/2-ch/2));left=R.l+R.w+16<W-cw?R.l+R.w+16:R.l-cw-16}
  if(left===undefined)left=R.l+R.w/2-cw/2;
  coach.style.left=Math.max(12,Math.min(W-cw-12,left))+'px';coach.style.top=Math.max(12,Math.min(H-ch-12,top))+'px'}
 else if(!el){coach.style.left='';coach.style.top=''}}

function go(n){i=n;const st=STEPS[i];if(st.enter)st.enter();if(PHONE()&&st.ph&&st.ph.tab&&typeof tab!=='undefined'&&screen==='game'){tab=st.ph.tab}
 if(screen==='game'&&s&&(st.enter||(PHONE()&&st.ph&&st.ph.tab)))render();draw()}
function update(){if(!on||busy)return;busy=true;try{
 if(!s||screen!=='game'||!s.tutorial){stop();return}
 let g=0;while(STEPS[i].done&&STEPS[i].done()&&g++<5)go(i+1);draw()}finally{busy=false}}
function stop(){on=false;if(coach)coach.remove();if(ring)ring.remove();coach=ring=null;if(s&&s.tutorial)delete s.tutorial}

function start(){hide();
 s=E.create({seed:2026,threats:false,rounds:10,players:[{name:'You'},{name:'Nova Syndicate',bot:true}]});s.tutorial=true;s.warned={0:true};
 screen='game';E.begin(s);give(['drum','sample','scrip','scrip','rig']);seedId=(s.board.find(c=>c.name==='Seed Stock')||s.board[0]).id;
 on=true;i=0;if(typeof tab!=='undefined')tab='board';try{save()}catch(e){}render();go(0)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-tut]');if(b){const a=b.dataset.tut;e.stopPropagation();
  if(a==='next'){Music.sfx('tab');go(i+1)}
  else if(a==='quit'){stop();s=null;try{localStorage.removeItem(SAVE)}catch(x){}renderSetup()}
  else if(a==='keep'){stop();s.threats=true;s.nextBoss=s.round+5;save();render();phase()}
  else if(a==='real'){stop();s=null;try{localStorage.removeItem(SAVE)}catch(x){}renderSetup()}
  return}
 const t=e.target.closest('[data-a=tutorial]');if(t&&!t.disabled){e.stopPropagation();start()}},true);
addEventListener('resize',()=>{if(on)draw()});

// redraw the coach after every screen update and dialog
const _render=render;render=function(){_render.apply(this,arguments);update()};
const _phase=phase;phase=function(){_phase.apply(this,arguments);update()};
return {start,stop,get on(){return on}};
})();
</script>
